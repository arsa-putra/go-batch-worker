name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    services:
      redis:
        image: redis:5-alpine
        ports:
          - 6379:6379

    steps:
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26'

    - name: Check out code
      uses: actions/checkout@v4

    - name: Install dependencies
      run: go mod download

    - name: Run tests
      run: go test -v ./...
